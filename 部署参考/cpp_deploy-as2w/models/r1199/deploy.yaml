# Speed envelope for the joystick/training-contract candidate (m/s, rad/s).
# This file is the only place to change it; allowed range 0.01..0.30.
# Any change requires offline re-verification (parity + MuJoCo at the new
# value) before field use, per the training-contract alignment rule.
# Verified envelope (2026-11-12, training-contract flags, measured start):
#   vx 0.2 m/s: forward/back x3 seeds all stable/tracked/held, no nonwheel.
#   wz 0.2 rad/s REJECTED: knee clearance down to 1.5mm, brake/hold exceed.
#   wz 0.1 rad/s: 6/6 stable, no nonwheel; yaw tracking ~50-65% of command,
#   post-turn hold drift up to 0.037m in 3/6 (cap 0.02m) — acceptable for a
#   supervised first yaw test only.
vx_limit: 0.2
wz_limit: 0.1
