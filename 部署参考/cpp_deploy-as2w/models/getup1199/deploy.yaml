damping: [3.2, 3.2, 3.2, 3.2, 3.2, 3.2, 3.2, 3.2, 3.2, 3.2, 3.2, 3.2, 4.0, 4.0, 4.0, 4.0]
# Training runtime contract (runs/recovery/deep-side-curriculum,
# formal/model_1199.pt, contract flags: staged_rise=true, support_handoff=true,
# fixed_stand_integral=true, low_support_handoff=true, recovery_symmetry=true,
# predictive_guard=true, observation_packet_loss=0.02 training-only).
# Every value below maps 1:1 to eval_as2w_mujoco_recovery.py / as2w_recovery_control.py.
action_scale: 0.35
action_clip: 2.0
staged_entry_ramp_s: [0.22, 0.50]
staged_plant_ramp_s: [0.22, 1.10]
staged_extend_ramp_s: [1.45, 1.20]
# normalized staged crouch anchor (pre action_scale)
staged_crouch: [0.0, 0.0, 0.0, 0.0, 0.46, 0.46, 0.46, 0.46, -0.72, -0.72, -0.72, -0.72]
staged_authority: 0.42
stable_height: 0.27
latch_quiet_s: 0.45
latch_min_height: 0.25
blend_tau_s: 0.85
integral_min_height: 0.25
integral_decay: 0.04
integral_gain: 1.10
integral_clip: 0.34
command_margin: 0.06
guard_lookahead_s: 0.04
guard_band: 0.10
guard_gain: 2.0
guard_margin: 0.06
wheel_hold_kp: 25.0
wheel_hold_kd: 4.0
# URDF angle table (training 90% envelope source; NOT hardware calibrated)
angle_lower_rad: [-0.7065, -0.7065, -0.7065, -0.7065, -1.72, -1.72, -1.09, -1.09, -2.65093, -2.65093, -2.65093, -2.65093]
