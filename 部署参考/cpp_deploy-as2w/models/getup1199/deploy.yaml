model_version: getup1199-deep-side-research
policy_file: policy.onnx
step_dt: 0.02
observation_size: 42
action_size: 12
# Policy joint order (official AS2-W reference order, same as r1199/r4000);
# hardware DDS slots come from config/r152_measured.map.
joint_names: [FL_hip, FR_hip, RL_hip, RR_hip, FL_thigh, FR_thigh, RL_thigh, RR_thigh, FL_calf, FR_calf, RL_calf, RR_calf, FL_foot, FR_foot, RL_foot, RR_foot]
default_joint_pos: [0.0, 0.0, 0.0, 0.0, 0.8, 0.8, 0.8, 0.8, -1.6, -1.6, -1.6, -1.6, 0.0, 0.0, 0.0, 0.0]
