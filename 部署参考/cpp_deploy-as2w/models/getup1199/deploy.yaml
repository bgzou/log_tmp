effort_fraction: 0.90
# Deployment-only: entry gate + success gate thresholds. Estimated signals
# (leg-FK height, wheel quietness) were validated 2026-11-13 against the
# training evaluator (40/40 rise, 24/40 strict pass, identical to baseline).
entry_min_up_z: 0.60
entry_max_height_est: 0.26
entry_wheel_quiet_dq: 0.35
success_height: 0.31
success_up: 0.95
success_joint_error: 0.18
success_speed: 0.06
success_spin: 0.18
success_hold_s: 2.0
